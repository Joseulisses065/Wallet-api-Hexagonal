services:
  db-wallet-api:
    image: postgres:17
    container_name: db-wallet-api

    restart: always

    shm_size: 128mb

    environment:
      POSTGRES_DB: ${DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - wallet_api_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wallet_api_postgres_data: